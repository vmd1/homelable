name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Each image is built once per architecture on a native runner (no QEMU), pushed
# by digest only, then the `merge` job stitches the digests into one multi-arch
# manifest per image and applies the tags.
jobs:
  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, arch: amd64, runner: ubuntu-latest, context: ".", dockerfile: Dockerfile.backend, build_args: "" }
          - { name: backend, arch: arm64, runner: ubuntu-24.04-arm, context: ".", dockerfile: Dockerfile.backend, build_args: "" }
          - { name: frontend, arch: amd64, runner: ubuntu-latest, context: ".", dockerfile: Dockerfile.frontend, build_args: "" }
          - { name: frontend, arch: arm64, runner: ubuntu-24.04-arm, context: ".", dockerfile: Dockerfile.frontend, build_args: "" }
          - { name: frontend-standalone, arch: amd64, runner: ubuntu-latest, context: ".", dockerfile: Dockerfile.frontend, build_args: "VITE_STANDALONE=true" }
          - { name: frontend-standalone, arch: arm64, runner: ubuntu-24.04-arm, context: ".", dockerfile: Dockerfile.frontend, build_args: "VITE_STANDALONE=true" }
          - { name: mcp, arch: amd64, runner: ubuntu-latest, context: "./mcp", dockerfile: Dockerfile.mcp, build_args: "" }
          - { name: mcp, arch: arm64, runner: ubuntu-24.04-arm, context: "./mcp", dockerfile: Dockerfile.mcp, build_args: "" }
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the owner may not be.
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/homelable-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - backend
          - frontend
          - frontend-standalone
          - mcp
    steps:
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/homelable-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
